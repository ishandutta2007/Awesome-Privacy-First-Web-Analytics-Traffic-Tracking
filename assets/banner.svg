<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="chart-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: -0.5px;
        fill: url(#primary-grad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stat-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #64748b;
      }
      .stat-val {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #f1f5f9;
      }

      /* Dynamic Animations (kept in background so foreground text is crystal clear) */
      @keyframes floatGrid {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(-8px); opacity: 0.28; }
        100% { transform: translateY(0px); opacity: 0.15; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0); }
      }
      @keyframes radarPing {
        0% { r: 4px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }

      .ambient-glow-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .ambient-glow-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 1000px 250px;
      }
      .bg-grid {
        animation: floatGrid 9s ease-in-out infinite;
      }
      .chart-wave {
        animation: waveFlow 12s ease-in-out infinite;
      }
      .pulse-ring {
        animation: radarPing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .interactive-card {
        animation: cardFloat 6s ease-in-out infinite;
      }
      .interactive-card-2 {
        animation: cardFloat 7s ease-in-out infinite 1s;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Animated Atmospheric Glows -->
  <circle class="ambient-glow-1" cx="240" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="ambient-glow-2" cx="980" cy="220" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="620" cy="280" r="110" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Geometric Grid Pattern (Subtle & Dynamic) -->
  <g class="bg-grid" stroke="#334155" stroke-width="0.8">
    <line x1="80" y1="40" x2="1120" y2="40" />
    <line x1="80" y1="120" x2="1120" y2="120" />
    <line x1="80" y1="200" x2="1120" y2="200" />
    <line x1="80" y1="280" x2="1120" y2="280" />
    <line x1="160" y1="20" x2="160" y2="340" />
    <line x1="360" y1="20" x2="360" y2="340" />
    <line x1="560" y1="20" x2="560" y2="340" />
    <line x1="760" y1="20" x2="760" y2="340" />
    <line x1="960" y1="20" x2="960" y2="340" />
  </g>

  <!-- Dynamic Wave Analytics Flow (Underneath Text) -->
  <g class="chart-wave" opacity="0.35">
    <path d="M 680 280 C 760 210, 840 290, 920 220 C 1000 150, 1080 240, 1180 180 L 1180 340 L 680 340 Z" fill="url(#chart-area)" />
    <path d="M 680 280 C 760 210, 840 290, 920 220 C 1000 150, 1080 240, 1180 180" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Pulse Node -->
    <circle class="pulse-ring" cx="920" cy="220" r="4" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="920" cy="220" r="4" fill="#38bdf8" />
    <circle cx="1040" cy="188" r="4" fill="#818cf8" />
  </g>

  <!-- Decorative Live Metric Cards in Background Right (Floating) -->
  <g class="interactive-card" transform="translate(860, 48)">
    <rect width="250" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <!-- Green Live Dot -->
    <circle cx="24" cy="26" r="5" fill="#10b981" />
    <circle cx="24" cy="26" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" class="pulse-ring" />
    <text x="38" y="30" class="stat-val" font-size="12" fill="#34d399">COOKIELSS &amp; 100% SOVEREIGN</text>
    <text x="24" y="54" class="subtitle-text" font-size="12" fill="#cbd5e1">GDPR • CCPA • PECR Compliant</text>
  </g>

  <g class="interactive-card-2" transform="translate(860, 140)">
    <rect width="250" height="74" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="30" class="stat-title">AVG SCRIPT WEIGHT</text>
    <text x="24" y="54" class="stat-val" font-size="20" fill="#38bdf8">&lt; 1.0 KB <tspan font-size="12" fill="#94a3b8" font-weight="400">(vs 45KB GA4)</tspan></text>
  </g>

  <!-- FOREGROUND: Clear, crisp Header Content (Never obscured) -->
  <g transform="translate(60, 60)">
    <!-- Category Pill -->
    <g>
      <rect width="232" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#38bdf8" class="badge-label">PRIVACY-FIRST TELEMETRY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" class="title-text">Awesome Privacy-First Web Analytics</text>

    <!-- Subtitle Description -->
    <text x="0" y="108" class="subtitle-text">Curated SaaS Platforms &amp; Self-Hosted Open-Source Traffic Tracking Engines</text>
    <text x="0" y="130" class="subtitle-text">Cookieless Tracking • Zero Fingerprinting • GDPR/CCPA Ready • High-Speed Telemetry</text>

    <!-- Feature Feature Tag Badges -->
    <g transform="translate(0, 160)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">🛡️ Zero Cookies</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="144" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="154" y="18" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">⚡ Ultra-Lightweight</text>

      <!-- Tag 3 -->
      <rect x="294" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="308" y="18" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">🔒 Self-Hostable</text>

      <!-- Tag 4 -->
      <rect x="444" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="458" y="18" fill="#cbd5e1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">📊 100% Data Ownership</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primary-grad)" />
</svg>
